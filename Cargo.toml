[package]
name = "battleship"
version = "0.1.0"
edition = "2021"

[dependencies]
num-traits = { version = "0.2", default-features = false }
rand = { version = "0.9.1", default-features = false, features = ["alloc", "small_rng"] }
anyhow = { version = "1", default-features = false }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "sync", "rt-multi-thread", "time"], optional = true, default-features = false }
tokio-tungstenite = { version = "0.24", optional = true }
tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
libm = { version = "0.2", default-features = false }
heapless = { version = "0.8", optional = true }
postcard = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.10", optional = true }
blake3 = { version = "1.5", optional = true }
uuid = { version = "1.5", features = ["v4", "serde"], optional = true }
futures = { version = "0.3", optional = true }
bindgen = { version = "0.69", optional = true }
seahash = { version = "4.1", default-features = false, optional = true }
csv = { version = "1.3", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
indicatif = { version = "0.17", optional = true }
thiserror = { version = "1.0", optional = true }

[features]
default = ["std", "cli", "ai", "tcp", "logging"]
std = ["rand/thread_rng", "anyhow/std", "tokio", "async-trait", "serde", "bincode", "clap"]
cli = ["std"]
ai = []
tcp = ["std"]
in-memory = ["std"]
logging = ["log", "env_logger"]
persistence = ["std", "blake3", "uuid", "futures", "heapless", "seahash"]
websocket = ["std", "tokio-tungstenite", "tungstenite", "serde_json", "futures-util"]
web = ["websocket"]
ble = ["heapless", "postcard"]
esp-idf = ["ble", "bindgen"]
data-generation = ["std", "csv", "chrono", "indicatif", "clap", "thiserror", "uuid"]

[dev-dependencies]
proptest = "1"
